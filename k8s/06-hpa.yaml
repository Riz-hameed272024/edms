apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: edms-api, namespace: edms }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: edms-api }
  minReplicas: 2
  maxReplicas: 10            # NFR-03 report surges
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
