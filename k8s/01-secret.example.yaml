# TEMPLATE ONLY - do not commit real values. Create the real Secret with:
#   kubectl -n edms create secret generic edms-secrets \
#     --from-file=JWT_PRIVATE_KEY=jwt_private.pem --from-file=JWT_PUBLIC_KEY=jwt_public.pem \
#     --from-literal=AUDIT_HMAC_KEY=$(openssl rand -hex 32) \
#     --from-literal=SEED_ADMIN_PASSWORD='<strong password>' \
#     --from-literal=SEED_ADMIN_MFA_SECRET=$(node -e "console.log(require('otplib').authenticator.generateSecret())")
apiVersion: v1
kind: Secret
metadata:
  name: edms-secrets
  namespace: edms
type: Opaque
stringData:
  JWT_PRIVATE_KEY: "<PEM>"
  JWT_PUBLIC_KEY: "<PEM>"
  AUDIT_HMAC_KEY: "<hex>"
  SEED_ADMIN_PASSWORD: "<password>"
  SEED_ADMIN_MFA_SECRET: "<base32>"
