name: EDMS CI/CD

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }

permissions:
  contents: read            # least privilege for the workflow token

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Checkout, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - name: Build (reproducible install from lockfile)
        run: npm ci
      - name: Lint (ESLint + security plugin)
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit -- --coverage
      - name: Integration tests
        run: npm run test:integration
      - name: System (end-to-end) tests
        run: npm run test:system
      - name: Fuzz test
        run: npm run test:fuzz
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            coverage/
            tests/fuzz/fuzz-report.json

  security:
    name: Security / static checks
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: Dependency audit (fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: SAST - Semgrep (custom EDMS rules + OWASP)
        run: |
          pip install semgrep
          semgrep --config .semgrep.yml --config p/owasp-top-ten --error --metrics=off src
      - name: Secret scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Build image, scan, package
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t edms-api:${{ github.sha }} -t edms-api:1.0.0 .
      - name: Scan image - Trivy (fail on HIGH/CRITICAL)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 edms-api:${{ github.sha }}
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-filename-pattern secret.example -summary k8s/
      - name: Save image as artifact (deploy package)
        run: docker save edms-api:1.0.0 | gzip > edms-api-1.0.0.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: edms-image, path: edms-api-1.0.0.tar.gz }

  deploy:
    name: Deploy to Minikube (kind in CI)
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: staging        # requires reviewer approval in GitHub environment settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: edms-image }
      - uses: helm/kind-action@v1
      - name: Load image and deploy
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          AUDIT_HMAC_KEY: ${{ secrets.AUDIT_HMAC_KEY }}
        run: |
          docker load < edms-api-1.0.0.tar.gz
          kind load docker-image edms-api:1.0.0 --name chart-testing
          kubectl apply -f k8s/00-namespace.yaml
          kubectl -n edms create secret generic edms-secrets \
            --from-literal=JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY" --from-literal=JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY" \
            --from-literal=AUDIT_HMAC_KEY="$AUDIT_HMAC_KEY" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/02-serviceaccount.yaml -f k8s/03-deployment.yaml -f k8s/04-service.yaml -f k8s/05-networkpolicy.yaml -f k8s/07-resourcequota.yaml
          kubectl -n edms rollout status deploy/edms-api --timeout=120s
          kubectl -n edms get pods,svc
